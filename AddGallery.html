    <main>
         <section class="add-gallery-section">
            <div class="container">
                <div class="gallery-form">
                    <h2>Add a Project to the Gallery</h2>
                    <p>
                        Add photos and details about a JKC Construction
                        project.
                    </p>

                    <form id="galleryForm">
                        <div class="gallery-field">
                            <label for="projectTitle">Project Title *</label>
                            <input
                                type="text"
                                id="projectTitle"
                                required
                                placeholder="e.g. Residential Renovation">
                        </div>

                        <div class="gallery-field">
                            <label for="category">Project Category *</label>
                            <select id="category" required>
                                <option value="">Select a category</option>
                                <option value="Residential">Residential</option>
                                <option value="Commercial">Commercial</option>
                                <option value="Renovation">Renovation</option>
                                <option value="Touch-Ups">Touch-Ups</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="gallery-field">
                            <label for="description">Project Description</label>
                            <textarea
                                id="description"
                                placeholder="Describe the work completed...">
                            </textarea>
                        </div>

                        <div class="gallery-field">
                          <label for="projectImages">Upload Project Photos</label>
                            <input
                               type="file"
                                id="projectImages"
                                accept="image/*"
                                multiple>
                        </div>

                        <div class="gallery-field">
                            <label for="projectVideos">Upload Project Videos</label>
                              <input
                                type="file"
                                id="projectVideos"
                                accept="video/mp4,video/webm,video/ogg"
                                multiple>
                        </div>

                        <div class="gallery-field">
                            <label>Media Preview</label>
                            <div id="mediaPreview" class="image-preview"></div>
                        </div>

                        <button class="gallery-submit" type="submit">
                            Add to Gallery
                        </button>

                        <div
                            id="formMessage"
                            class="form-message"
                            role="status"
                            aria-live="polite">
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
